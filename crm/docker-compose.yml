# CRM de Leads + Atendimento WhatsApp com IA
#
# ⚠️ ESTE COMPOSE É PARA TESTE LOCAL. Em produção o deploy é via Easypanel
#    (serviços nativos gerenciados) — ver EASYPANEL.md.
#
#   cp .env.example .env   # preencher os valores
#   docker compose up -d
#   # painel local em http://localhost:3000
#
# Serviços (local): postgres (bancos crm+evolution), redis, evolution-api, crm-web

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: crm
    volumes:
      - pgdata:/var/lib/postgresql/data
      # cria o banco "evolution" além do "crm" no primeiro boot
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d crm"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  evolution-api:
    image: atendai/evolution-api:v2.2.3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SERVER_URL: ${EVOLUTION_API_URL}
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY}
      # Banco (Prisma da própria Evolution) -> banco "evolution"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      # Cache Redis
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      # Webhook GLOBAL -> aponta pro crm-web (interno ao compose). Só o evento de msg recebida.
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://crm-web:3000/api/whatsapp/webhook
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      # Identificação do dispositivo no WhatsApp
      CONFIG_SESSION_PHONE_CLIENT: Hervesson CRM
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: "30"
      DEL_INSTANCE: "false"
      LANGUAGE: pt-BR
    volumes:
      - evolution_instances:/evolution/instances
    ports:
      # exposto só na rede local da VPS pra abrir o Manager e escanear o QR
      - "127.0.0.1:8080:8080"

  crm-web:
    build: ./crm-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/crm?schema=public
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AI_MODEL: ${AI_MODEL}
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${AUTHENTICATION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      PUBLIC_PANEL_URL: ${PUBLIC_PANEL_URL}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
    ports:
      # acesso local ao painel (em produção o Easypanel/Traefik expõe via domínio)
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
  redisdata:
  evolution_instances:
