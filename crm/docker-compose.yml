# CRM de Leads + Atendimento WhatsApp com IA
#
# ⚠️ ESTE COMPOSE É PARA TESTE LOCAL. Em produção o deploy é via Easypanel
#    (serviços nativos gerenciados) — ver EASYPANEL.md.
#
#   cp .env.example .env   # preencher os valores
#   docker compose up -d
#   # painel local em http://localhost:3000
#
# O WhatsApp entra pela Cloud API oficial da Meta — não há container de
# mensageria aqui. O que sobe é só o banco e o painel. Para o webhook chegar
# na sua máquina em desenvolvimento, exponha a porta 3000 por um túnel HTTPS
# e cadastre essa URL no painel do app da Meta.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d crm"]
      interval: 10s
      timeout: 5s
      retries: 5

  crm-web:
    build: ./crm-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/crm?schema=public
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AI_MODEL: ${AI_MODEL}
      # --- WhatsApp Cloud API (Meta) ---
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION}
      # --- Painel ---
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      PUBLIC_PANEL_URL: ${PUBLIC_PANEL_URL}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
    ports:
      # acesso local ao painel (em produção o Easypanel/Traefik expõe via domínio)
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
